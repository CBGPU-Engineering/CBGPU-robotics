name: Native SDK CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable run --locked --bin cbgpu-robotics -- demo
      - run: cargo +stable run --locked --bin cbgpu-robotics -- demo --execute-simulation
      - run: cargo +stable test --locked --features ros2
      - run: cargo +stable clippy --locked --all-targets --features ros2 -- -D warnings
      - run: cargo +stable build --locked --release --features ros2
      - run: cargo +stable test --locked --no-default-features --features ros2-humble
      - name: Fake DDS and Nav2 only, never robot hardware
        if: runner.os == 'Linux'
        run: |
          cargo +stable test --locked --features ros2 --test ros2_dds -- --ignored
          cargo +stable test --locked --no-default-features --features ros2-humble --test ros2_dds -- --ignored
